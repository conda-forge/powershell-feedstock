context:
  name: powershell
  version: 7.6.8

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://raw.githubusercontent.com/PowerShell/PowerShell/refs/tags/v${{ version }}/assets/additionalAttributions.txt
    sha256: cd2d609357d2eebb43ada3870b9a63eb2c155c237ca89ad6cfaa4215023a5dab
    target_directory: powershell/assets
  - if: win and x86_64
    then:
      - url: https://github.com/PowerShell/PowerShell/releases/download/v${{ version }}/PowerShell-${{ version }}-win-x64.zip
        sha256: b9f074f923c499b51ec99d313da8e9ae90d17a9f3adf00c73d6189f34d908528
        target_directory: powershell
  - if: win and arm64
    then:
      - url: https://github.com/PowerShell/PowerShell/releases/download/v${{ version }}/PowerShell-${{ version }}-win-arm64.zip
        sha256: e889c9bfa6c3a9796bd6268cbeeb389e3968f77c6db46cb282178274d71c160b
        target_directory: powershell
  - if: linux and x86_64
    then:
      - url: https://github.com/PowerShell/PowerShell/releases/download/v${{ version }}/powershell-${{ version }}-linux-x64.tar.gz
        sha256: 59112e38ad83350e4f6dc0195953c66b5926792f300ca2e7691b8242e7a16e7f
        target_directory: powershell
  - if: linux and aarch64
    then:
      - url: https://github.com/PowerShell/PowerShell/releases/download/v${{ version }}/powershell-${{ version }}-linux-arm64.tar.gz
        sha256: 3179e07fd98f026d39c730ebcb7626d071aac3351b171dda13f9f38d99efcef0
        target_directory: powershell
  - if: osx and arm64
    then:
      - url: https://github.com/PowerShell/PowerShell/releases/download/v${{ version }}/powershell-${{ version }}-osx-arm64.tar.gz
        sha256: c16a3f433966c6fd5a9c8a660a95c92cb5dbc4b1813416501d1ba30ca160da32
        target_directory: powershell


build:
  number: 0
  skip:
    - osx and x86_64  # Skip Intel macOS for now
  script:
    - if: win
      then: |
        xcopy powershell "%PREFIX%\powershell" /E /I /F /B /Y
        if %ERRORLEVEL% neq 0 exit 1
        echo F | xcopy %RECIPE_DIR%\pwsh.cmd %PREFIX%\Scripts\pwsh.cmd /F /Y
        if %ERRORLEVEL% neq 0 exit 1
    - if: unix
      then: |
        mkdir -p $PREFIX/powershell
        cp -r powershell/* $PREFIX/powershell/
        chmod +x $PREFIX/powershell/pwsh
        mkdir -p $PREFIX/bin
        cp $RECIPE_DIR/pwsh.sh $PREFIX/bin/pwsh
        chmod +x $PREFIX/bin/pwsh

requirements:
  run:
    - if: linux
      then:
        - icu


tests:
  - script:
      - if: win
        then:
          - where powershell
          - if not exist %PREFIX%\\powershell\\pwsh.exe exit 1
      - if: unix
        then:
          - which pwsh
          - test -x $PREFIX/powershell/pwsh
          - pwsh -Version

about:
  summary: PowerShell for every system!
  license: MIT
  license_file:
    - powershell/LICENSE.txt
    - powershell/ThirdPartyNotices.txt
    - powershell/assets/additionalAttributions.txt

  homepage: https://github.com/PowerShell/PowerShell

extra:
  recipe-maintainers:
    - chawyehsu
    - dhirschfeld
